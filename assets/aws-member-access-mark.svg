<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">AI AWS Club member access logo</title>
  <desc id="desc">Rounded dark square with white AWS lettering and a warm orange smile underline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17243a"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="smile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="18" y="18" width="284" height="284" rx="62" fill="url(#bg)" stroke="#58a6ff" stroke-opacity=".55" stroke-width="3"/>
  <rect x="34" y="34" width="252" height="252" rx="50" fill="none" stroke="#a371f7" stroke-opacity=".12" stroke-width="2"/>
  <text x="160" y="172" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="82" font-weight="900" letter-spacing="2" fill="#f8fafc" filter="url(#softGlow)">AWS</text>
  <path d="M90 211 C132 239 205 239 241 208" fill="none" stroke="url(#smile)" stroke-width="10" stroke-linecap="round" filter="url(#softGlow)"/>
  <circle cx="241" cy="208" r="5.5" fill="#fbbf24"/>
</svg>
